version: '3.9'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: serenica-postgres
    environment:
      POSTGRES_DB: serenica
      POSTGRES_USER: serenica_user
      POSTGRES_PASSWORD: serenica_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenica_user -d serenica"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: serenica-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: serenica-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/generate"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build: .
    container_name: serenica-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://serenica_user:serenica_password@postgres:5432/serenica
      REDIS_URL: redis://redis:6379/0
      USE_OLLAMA: "True"
      OLLAMA_MODEL: mistral
      DEBUG: "False"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker (optional, for async tasks)
  celery_worker:
    build: .
    container_name: serenica-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://serenica_user:serenica_password@postgres:5432/serenica
      CELERY_BROKER: redis://redis:6379/1
      CELERY_BACKEND: redis://redis:6379/2
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
    command: celery -A app.tasks worker --loglevel=info
    profiles:
      - optional

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  default:
    name: serenica-network
