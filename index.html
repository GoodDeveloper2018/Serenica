<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Serenica Therapy Chatbot</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Example fade-in animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      animation: fadeIn 1.2s ease-in; /* Entrance animation */
      background-color: #f4f4f4;
    }

    .chat-container {
      max-width: 600px; margin: 50px auto; padding: 20px;
      background-color: #fff; border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #chat-window {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .user-msg {
      text-align: right;
      margin: 5px 0;
      color: #333;
    }

    .bot-msg {
      text-align: left;
      margin: 5px 0;
      background-color: #e8f5e9;
      display: inline-block;
      padding: 8px 10px;
      border-radius: 5px;
    }

    .input-container {
      display: flex; gap: 10px;
    }

    #user_input {
      flex: 1;
      padding: 10px; border-radius: 5px;
      border: 1px solid #ddd;
    }

    #send-btn, #reset-btn {
      padding: 10px 20px;
      border: none; border-radius: 5px;
      cursor: pointer;
    }

    #send-btn {
      background-color: #007bff; color: #fff;
    }

    #reset-btn {
      background-color: #dc3545; color: #fff;
      margin-left: 10px;
    }

  </style>
</head>
<body>
  <div class="chat-container">
    <h2>Serenica Therapy Chatbot</h2>
    <div id="chat-window"></div>

    <div class="input-container">
      <input type="text" id="user_input" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
      <button id="reset-btn">Reset</button>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user_input');
    const sendBtn = document.getElementById('send-btn');
    const resetBtn = document.getElementById('reset-btn');

    // Utility: append a message to the chat window
    function appendMessage(content, sender) {
      const msgDiv = document.createElement('div');
      if (sender === 'user') {
        msgDiv.classList.add('user-msg');
        msgDiv.textContent = `You: ${content}`;
      } else {
        msgDiv.classList.add('bot-msg');
        msgDiv.textContent = `Bot: ${content}`;
      }
      chatWindow.appendChild(msgDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Handle Send
    sendBtn.addEventListener('click', async () => {
      const text = userInput.value.trim();
      if (!text) return;

      // Show user message
      appendMessage(text, 'user');
      userInput.value = '';

      // Call server
      try {
        const response = await fetch('/api/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_input: text })
        });
        const data = await response.json();
        if (data.response) {
          appendMessage(data.response, 'bot');
        }
      } catch (err) {
        console.error(err);
        appendMessage("Error: Could not reach server.", 'bot');
      }
    });

    // Handle Reset
    resetBtn.addEventListener('click', async () => {
      try {
        const response = await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        await response.json();

        // Clear UI
        chatWindow.innerHTML = '';
        appendMessage("Conversation reset.", "bot");
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
